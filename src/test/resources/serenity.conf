webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    unhandledPromptBehavior = accept
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "test-type",
        "ignore-certificate-errors",
        "incognito",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "disable-dev-shm-usage",
        "disable-extensions",
        "disable-web-security",
        "disable-translate",
        "disable-logging",
        "disable-download-notification",
        "start-maximized",
        "allow-running-insecure-content",
        "--lang=es",
        "--window-size=1920,1080",
        "--always-authorize-plugins"
      ]
      prefs = {
        "download.default_directory" = "${user.dir}/target"
      }
    }
    timeouts {
      implicit = 10000
      pageLoad = 10000
    }
  }
  wait.for.timeout = 10000
}

drivers {
  automatically.download = true
}

serenity {
  requirements.dir = "src/test/resources/features"
}

headless.mode = false